name: Feature request
description: Suggest an improvement to Chores Manager Cards
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Dashboard problem
      description: Describe the workflow or limitation this should address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the cards should behave.
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend considerations
      description: Note whether this requires new integration data or authorization behavior.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing Home Assistant dashboard features or workarounds you considered.
